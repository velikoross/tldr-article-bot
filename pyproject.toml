[project]
name = "tldr-article-bot"
version = "1.0.0"
description = "Telegram-бот: выжимка статьи по ссылке и совет, стоит ли её читать"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
